<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>새롬 사육사 돕기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one projector screen — zoo signboard header, content stage, two fenced enclosures (우리) side by side. Single light look on purpose (projector-friendly). */
:root{
  --leaf:#1F5B3A;      /* zoo sign green */
  --leaf-deep:#123A25;
  --sun:#F2B705;       /* keeper badge yellow */
  --ground:#EEF2E6;    /* pale grass-grey page */
  --paper:#FFFFFF;
  --ink:#1C2A21;
  --muted:#5C6B60;
  --eye:#1E6FB8;       /* 눈으로 확인 */
  --eye-soft:#E3EEF9;
  --heart:#C2457A;     /* 마음으로 느낌 */
  --heart-soft:#FBE7EF;
  --wood:#9A6B3F;
  --wood-dark:#6E4A2A;
  --ok:#2E8B57;
  --ok-soft:#E2F3E8;
  --hint:#B7791F;
  --hint-soft:#FFF4DA;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --fs:clamp(16px,1.45vw + .35vh,26px);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

#app{min-height:100%;display:flex;flex-direction:column}
.bar{background:var(--leaf);color:#fff;display:flex;align-items:center;gap:.8em;flex-wrap:wrap;
  padding-block:.45em;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:.3em solid var(--sun)}
.brand{font-family:var(--display);font-size:1.15em;display:flex;align-items:center;gap:.4em;background:none;border:0;color:#fff;padding:0}
.brand .badge{width:1.6em;height:1.6em;border-radius:50%;background:var(--sun);color:var(--leaf-deep);display:grid;place-items:center;font-size:.8em}
.tabs{display:flex;gap:.35em;margin-left:auto;flex-wrap:wrap}
.tab{background:transparent;border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:.15em .8em;font-family:var(--display);font-size:.8em}
.tab[aria-current="true"]{background:var(--sun);color:var(--leaf-deep);border-color:var(--sun)}
.tools{display:flex;gap:.35em}
.tool{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:.5em;padding:.2em .6em;font-size:.72em}

main{flex:1;display:flex;flex-direction:column;gap:.9em;
  padding-block:1em 1.2em;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:1500px;width:100%;margin:0 auto}

h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:2.3em;color:var(--leaf-deep)}
h2{font-size:1.6em;color:var(--leaf-deep)}
p{margin:0}
.eyebrow{font-family:var(--display);color:var(--wood);font-size:.85em;letter-spacing:.04em}

/* Home */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1.5em;align-items:center;flex:1}
.story{display:flex;gap:1em;align-items:flex-end}
.keeper{width:7em;flex:none}
.bubble{background:var(--paper);border:3px solid var(--leaf);border-radius:1em;padding:.8em 1em;position:relative;font-size:1.05em}
.bubble::before{content:"";position:absolute;left:-14px;bottom:1.2em;border:12px solid transparent;border-right-color:var(--leaf);border-left:0}
.bubble b{font-family:var(--display);font-weight:400;color:var(--leaf)}
.stages{display:flex;flex-direction:column;gap:.7em}
.stage-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.9em;align-items:center;text-align:left;
  background:var(--paper);border:0;border-left:.45em solid var(--leaf);border-radius:.6em;padding:.8em 1em;box-shadow:0 2px 0 rgba(18,58,37,.12)}
.stage-card:hover{transform:translateY(-2px)}
.stage-card .num{font-family:var(--display);font-size:1.5em;width:1.8em;height:1.8em;border-radius:50%;background:var(--ground);color:var(--leaf);display:grid;place-items:center}
.stage-card h3{font-size:1.15em}
.stage-card .when{font-size:.72em;color:var(--muted)}
.stage-card .go{font-family:var(--display);color:var(--leaf);font-size:1.4em}

/* Stage 1 */
.s1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.2em;flex:1;align-items:start}
.crit-card{background:#FFF7C9;border-radius:.3em;padding:1.2em 1em;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.07);transform:rotate(-1deg);position:relative}
.crit-card::before{content:"";position:absolute;top:-.55em;left:50%;width:4em;height:1.1em;margin-left:-2em;background:rgba(242,183,5,.55);transform:rotate(2deg)}
.crit-card .label{font-size:.75em;color:var(--muted)}
.crit-card .q{font-family:var(--display);font-size:3.1em;color:var(--ink);line-height:1.2;margin-top:.15em}
.crit-card .chal{display:inline-block;background:var(--leaf);color:#fff;font-family:var(--display);font-size:.7em;border-radius:999px;padding:0 .7em;margin-bottom:.3em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:.7em;margin-top:1em}
.choice{border:3px solid;border-radius:.8em;padding:.8em .6em;background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:.3em;font-family:var(--display);font-size:1.15em}
.choice svg{width:2.4em;height:2.4em}
.choice.eye{border-color:var(--eye);color:var(--eye)}
.choice.heart{border-color:var(--heart);color:var(--heart)}
.choice.eye:hover,.choice.eye.picked{background:var(--eye-soft)}
.choice.heart:hover,.choice.heart.picked{background:var(--heart-soft)}
.choice[disabled]{cursor:default;opacity:.45}
.choice.picked{opacity:1}
.dots{display:flex;gap:.35em;justify-content:center;margin-top:.9em}
.dot{width:.65em;height:.65em;border-radius:50%;background:#cfd8cc}
.dot.done{background:var(--leaf)}
.dot.now{background:var(--sun);outline:2px solid var(--leaf)}

.feedback{background:var(--paper);border-radius:.8em;padding:1em;display:flex;flex-direction:column;gap:.7em;min-height:100%}
.feedback .wait{color:var(--muted);text-align:center;margin:auto;font-size:1.05em}
.verdict{font-family:var(--display);font-size:1.35em}
.verdict.good{color:var(--ok)}
.verdict.think{color:var(--hint)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.who{border-radius:.6em;padding:.6em .7em;background:var(--ground)}
.who .name{font-family:var(--display);color:var(--leaf);font-size:.85em}
.who .say{font-size:.95em}
.who .ans{font-family:var(--display);font-size:1em;margin-top:.2em}
.ex-animal{font-size:2.2em;text-align:center;line-height:1}
.result-tag{font-family:var(--display);text-align:center;border-radius:.5em;padding:.35em;font-size:1.15em}
.result-tag.same{background:var(--eye-soft);color:var(--eye)}
.result-tag.diff{background:var(--heart-soft);color:var(--heart)}
.why{font-size:.95em}
.btn{font-family:var(--display);background:var(--leaf);color:#fff;border:0;border-radius:.6em;padding:.5em 1.1em;font-size:1.05em;align-self:flex-end}
.btn.ghost{background:transparent;color:var(--leaf);border:3px solid var(--leaf)}
.btn.sun{background:var(--sun);color:var(--leaf-deep)}
.row{display:flex;gap:.6em;flex-wrap:wrap;justify-content:flex-end}

.board{display:grid;grid-template-columns:1fr 1fr;gap:1em}
.board-col{border-radius:.8em;padding:.9em;min-width:0}
.board-col.same{background:var(--eye-soft);border:3px solid var(--eye)}
.board-col.diff{background:var(--heart-soft);border:3px solid var(--heart)}
.board-col h3{font-size:1.2em}
.board-col.same h3{color:var(--eye)}
.board-col.diff h3{color:var(--heart)}
.board-col .sub{font-size:.8em;color:var(--muted);margin-bottom:.5em}
.chips{display:flex;flex-wrap:wrap;gap:.4em}
.chip{background:#FFF7C9;font-family:var(--display);padding:.15em .6em;border-radius:.25em;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.takeaway{background:var(--leaf);color:#fff;border-radius:.8em;padding:1em 1.2em;display:flex;flex-direction:column;gap:.3em}
.takeaway b{font-family:var(--display);font-weight:400;font-size:1.25em;color:var(--sun)}

/* Stage 2/3: zoo */
.zoo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr) minmax(0,1fr);gap:1em;align-items:stretch;flex:1}
.gate{display:flex;flex-direction:column;align-items:center;gap:.5em;text-align:center}
.arrival{background:var(--paper);border-radius:1em;padding:.7em;width:100%;display:flex;flex-direction:column;align-items:center;gap:.2em;position:relative;border:3px dashed var(--wood)}
.arrival .pic{width:100%;max-width:15em;aspect-ratio:200/170;position:relative}
.arrival .pic svg{width:100%;height:100%;display:block}
.nametag{font-family:var(--display);font-size:1.3em;background:var(--sun);color:var(--leaf-deep);border-radius:.3em;padding:0 .7em}
.nametag.lost{background:var(--ground);color:var(--muted);border:2px dashed var(--muted);transform:rotate(-3deg)}
.gate .ask{font-family:var(--display);font-size:1.05em;color:var(--leaf-deep)}
.gate .crit-mini{font-family:var(--display);background:#FFF7C9;padding:.2em .8em;border-radius:.25em;font-size:1.25em;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.callout{position:absolute;font-family:var(--display);font-size:.8em;background:var(--heart);color:#fff;border-radius:.4em;padding:0 .5em;white-space:nowrap}
.callout.b{background:var(--eye)}

.pen{display:flex;flex-direction:column;background:transparent;border:0;padding:0;text-align:center;border-radius:.8em;min-width:0}
.pen .plaque{background:var(--wood);color:#fff;border-radius:.4em .4em 0 0;padding:.35em .5em;border:3px solid var(--wood-dark);border-bottom:0}
.pen .plaque b{font-family:var(--display);font-weight:400;font-size:1.5em;display:block;line-height:1.2}
.pen .plaque small{font-size:.8em;opacity:.9}
.pen .yard{flex:1;min-height:9em;background:
   linear-gradient(transparent 70%, rgba(110,74,42,.12) 70%),
   #DCE9C9;
   border-left:.5em solid var(--wood);border-right:.5em solid var(--wood);display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:.2em;padding:.5em;position:relative}
.pen .fence{height:1.3em;background:repeating-linear-gradient(90deg,var(--wood) 0 .5em,transparent .5em 1.3em),linear-gradient(transparent 35%,var(--wood-dark) 35% 55%,transparent 55%);border-radius:0 0 .3em .3em}
.pen:hover .yard,.pen.glow .yard{background-color:#CDE3B0}
.pen.glow{outline:5px solid var(--sun);outline-offset:3px}
.pen.wrong{animation:shake .4s}
.pen[disabled]{cursor:default}
.resident{width:5.2em;display:flex;flex-direction:column;align-items:center;animation:pop .45s ease-out}
.resident svg{width:100%;height:auto;display:block}
.resident span{font-family:var(--display);font-size:.75em;background:rgba(255,255,255,.85);border-radius:.3em;padding:0 .4em}
.pen-hint{position:absolute;inset:0;display:grid;place-items:center;color:rgba(28,42,33,.35);font-family:var(--display);font-size:1em;pointer-events:none}

.msg{border-radius:.8em;padding:.7em 1em;display:flex;gap:.8em;align-items:center;justify-content:space-between;flex-wrap:wrap}
.msg.ok{background:var(--ok-soft);border:3px solid var(--ok)}
.msg.hint{background:var(--hint-soft);border:3px solid var(--hint)}
.msg.info{background:var(--paper);border:3px solid var(--leaf)}
.msg.puzzle{background:var(--heart-soft);border:3px solid var(--heart)}
.msg p{flex:1;min-width:12em}
.msg strong{font-family:var(--display);font-weight:400;font-size:1.15em}

.pick-crit{display:flex;flex-direction:column;gap:.8em;flex:1}
.crit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(11em,1fr));gap:.8em}
.crit-btn{background:#FFF7C9;border:0;border-radius:.3em;padding:1em .6em;font-family:var(--display);font-size:1.6em;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.crit-btn:nth-child(odd){transform:rotate(-1deg)}
.crit-btn:nth-child(even){transform:rotate(1deg)}
.crit-btn:hover{background:#FFEF9A}
.lineup{display:flex;gap:1em;justify-content:center;flex-wrap:wrap}
.lineup figure{margin:0;width:8em;text-align:center}
.lineup figure svg{width:100%;height:auto}
.lineup figcaption{font-family:var(--display)}

.qr-wrap{position:fixed;inset:0;background:rgba(18,58,37,.82);display:grid;place-items:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.qr-card{background:var(--paper);border-radius:1em;padding:1.2em 1.5em;display:flex;flex-direction:column;align-items:center;gap:.7em;max-width:100%;border:.35em solid var(--sun)}
.qr-box{width:min(70vh,80vw);aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:#fff}
.qr-box img,.qr-box canvas{width:100%!important;height:auto!important;image-rendering:pixelated}
.qr-url{font-size:.75em;color:var(--muted);word-break:break-all;text-align:center;user-select:all}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:900px){
  .home,.s1{grid-template-columns:1fr}
  .zoo{grid-template-columns:1fr 1fr}
  .zoo .gate{grid-column:1 / -1;order:-1}
  h1{font-size:1.8em}
}
@media (max-width:520px){
  .duo,.board,.choices{grid-template-columns:1fr}
  .crit-card .q{font-size:2.3em}
  .keeper{width:5em}
}
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <button class="brand" id="homeBtn" type="button"><span class="badge">숲</span>숲속 동물원 · 새롬 사육사 돕기</button>
    <nav class="tabs" id="tabs" aria-label="활동 단계"></nav>
    <div class="tools">
      <button class="tool" id="soundBtn" type="button" aria-pressed="true">소리 켬</button>
      <button class="tool" id="fsBtn" type="button">전체 화면</button>
      <button class="tool" id="qrBtn" type="button">QR 코드</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="qr-wrap" id="qrWrap" hidden>
  <div class="qr-card" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
    <h2 id="qrTitle">태블릿으로 찍어 보세요!</h2>
    <div id="qrBox" class="qr-box"></div>
    <p class="qr-url" id="qrUrl"></p>
    <button class="btn" type="button" id="qrClose">닫기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

/* ---------- sound ---------- */
let soundOn=true,ac=null;
function tone(kind){
  if(!soundOn)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const seq=kind==="good"?[660,880]:kind==="puzzle"?[520,440,620]:[330,300];
    seq.forEach((f,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f;
      const t=ac.currentTime+k*0.13;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+0.3);});
  }catch(e){}
}

     ${showGate?`<div class="pic">${ART.platypus()}${callouts}</div><span class="nametag">오리너구리</span>`:`<p style="padding:2em 0;color:var(--muted)">오리너구리가 우리에 들어갔어요.</p>`}
    </div>
    <p class="ask">${s3.step===0?"어느 우리에 넣어야 할까요?":s3.step===1?"정말 이 우리 하나뿐일까요?":"두 우리에 모두 들어가요!"}</p></div>`;
  let msg="";
  if(s3.step===0)msg=`<div class="msg info"><p>동물원에는 여러분이 알려 준 기준으로 만든 두 우리가 있어요. 오리너구리를 자세히 보고 골라 보세요.</p></div>`;
  if(s3.step===1){
    const t=s3.first==="beak"?"부리가 있으니까 부리 우리에 넣었어요.":"다리가 네 개니까 다리 우리에 넣었어요.";
    msg=`<div class="msg ok"><p><strong>${t}</strong> 그런데 오리너구리를 한 번 더 자세히 볼까요?</p><button class="btn sun" type="button" data-act="s3look">다시 자세히 보기</button></div>`;
  }
  if(s3.step===2)msg=`<div class="msg puzzle"><p><strong>부리도 있고, 다리도 네 개예요!</strong> 한 가지 생김새로만 만든 우리로는 오리너구리가 들어갈 곳을 하나로 정할 수 없어요. 어떻게 하면 좋을까요?</p><button class="btn" type="button" data-act="s3end">생각해 보기 →</button></div>`;
  if(s3.step===3)msg=`<div class="msg puzzle"><p><strong>오늘은 답을 정하지 말고, 집에 가서도 생각해 보세요.</strong> 다음 시간에는 오리너구리가 들어갈 우리를 정하는 방법을 함께 찾아봐요!</p><div class="row"><button class="btn ghost" type="button" data-act="s3reset">다시 해 보기</button><button class="btn" type="button" data-go="home">처음 화면</button></div></div>`;
  return `<p class="eyebrow">3단계 · 마지막 손님</p>
   <section class="zoo">${pen("beak","부리 우리","부리가 있는 동물",glowB)}${gate}${pen("legs","다리 우리","다리가 네 개인 동물",glowL)}</section>${msg}`;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){go(g.dataset.go);return}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const v=b.dataset.v;
  switch(b.dataset.act){
    case "s1pick":{s1.pick=v;const it=S1[s1.i];tone((v==="same")===it.same?"good":"hint");render();break}
    case "s1next":s1.i++;s1.pick=null;render();break;
    case "s1reset":s1={i:0,pick:null,log:[]};render();break;
    case "s2crit":s2={crit:v,i:0,yes:[],no:[],fb:null,shake:null,revealed:false};render();break;
    case "s2put":{
      const a=NEW[s2.i],yes=a.has[s2.crit],side=yes?"yes":"no",who=a.mystery?"이 동물은":josa(a.name,"은","는");
      if(v===side){s2[side].push(s2.i);s2.shake=null;
        s2.fb={ok:true,text:`${who} ${a.r[s2.crit]}. 그래서 '${yes?"그렇다":"그렇지 않다"}' 우리예요.`};tone("good");}
      else{s2.shake=v;s2.fb={ok:false,text:s2.crit==="four"?"다리를 하나씩 세어 보세요.":`${josa(CRIT[s2.crit].look,"이","가")} 있는지 찾아보세요.`};tone("hint");}
      render();break}
    case "s2next":s2.i++;s2.fb=null;s2.shake=null;render();break;
    case "s2reveal":s2.revealed=true;tone("good");render();break;
    case "s2reset":s2={crit:null,i:0,yes:[],no:[],fb:null,shake:null,revealed:false};render();break;
    case "s3put":s3={step:1,first:v};tone("good");render();break;
    case "s3look":s3.step=2;tone("puzzle");render();break;
    case "s3end":s3.step=3;render();break;
    case "s3reset":s3={step:0,first:null};render();break;
  }
});
document.getElementById("homeBtn").addEventListener("click",()=>go("home"));
const sb=document.getElementById("soundBtn");
sb.addEventListener("click",()=>{soundOn=!soundOn;sb.textContent=soundOn?"소리 켬":"소리 끔";sb.setAttribute("aria-pressed",soundOn)});
document.getElementById("fsBtn").addEventListener("click",()=>{
  try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}
});
const QR_URL=location.href.split("#")[0];
const qrWrap=document.getElementById("qrWrap"),qrBox=document.getElementById("qrBox");
let qrMade=false;
document.getElementById("qrUrl").textContent=QR_URL;
document.getElementById("qrBtn").addEventListener("click",()=>{
  qrWrap.hidden=false;
  if(!qrMade){
    try{new QRCode(qrBox,{text:QR_URL,width:512,height:512,colorDark:"#123A25",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});qrMade=true}
    catch(e){qrBox.innerHTML='<p style="padding:1em;text-align:center">QR 코드를 불러오지 못했어요.<br>아래 주소를 칠판에 적어 주세요.</p>'}
  }
  document.getElementById("qrClose").focus();
});
document.getElementById("qrClose").addEventListener("click",()=>{qrWrap.hidden=true});
qrWrap.addEventListener("click",e=>{if(e.target===qrWrap)qrWrap.hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")qrWrap.hidden=true});
render();
})();
</script>
</body>
</html>
